name: Deploy to Cloudflare Pages
run-name: ${{ inputs.parent_identity && format('Friday Frame {0} {1}', inputs.parent_identity, inputs.expected_sha) || 'Deploy to Cloudflare Pages' }}

on:
  push:
    branches: [astro-rebuild]
  # Added 2026-08-17 for friday-frame.yml, which commits the weekly un-draft
  # with the default GITHUB_TOKEN. GitHub does not raise push events for
  # commits made with that token, so the push above never fires this workflow
  # and the site is never rebuilt. workflow_dispatch is one of the two
  # documented exceptions to that rule, so friday-frame.yml dispatches this
  # workflow explicitly and waits for it before verifying.
  #
  # Behaviour is unchanged for every other path. A dispatch pinned to
  # astro-rebuild resolves github.ref_name to astro-rebuild exactly as a push
  # does, so the wrangler --branch argument below is identical either way.
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact publication commit for a Friday Frame child deployment
        type: string
        default: ''
      parent_identity:
        description: Friday Frame parent run ID and attempt
        type: string
        default: ''

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Validate requested publication identity
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          PARENT_IDENTITY: ${{ inputs.parent_identity }}
          EVENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ -n "$EXPECTED_SHA$PARENT_IDENTITY" ]; then
            [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::Invalid expected source identity."; exit 1; }
            [[ "$PARENT_IDENTITY" =~ ^[0-9]+/[0-9]+$ ]] || { echo "::error::Invalid parent identity."; exit 1; }
            [ "$EXPECTED_SHA" = "$EVENT_SHA" ] || { echo "::error::Branch moved before dispatch. No deployment attempted."; exit 1; }
          fi
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm run build
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=adrianwatkins-com-preview --branch=${{ github.ref_name }}
