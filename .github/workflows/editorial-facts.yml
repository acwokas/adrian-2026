name: Editorial factual gates
on:
  pull_request:
  push:
    branches: [astro-rebuild]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Friday Frame metadata and child identity contracts (offline)
        run: python3 -m unittest discover -s .github/scripts -p "test_friday_frame_*.py" -v
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run test:editorial
      - run: node scripts/check-editorial-facts.mjs
