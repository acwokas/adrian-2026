name: Editorial factual gates
on:
  pull_request:
  push:
    branches: [astro-rebuild]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run test:editorial
      - run: node scripts/check-editorial-facts.mjs
